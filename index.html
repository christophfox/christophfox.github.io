<style>

:root {
  --paper: #fffaf3;
  --paper-warm: #f5e9db;
  --fox-light: #d98a5d;
  --fox: #a95435;
  --fox-dark: #74331f;
  --fox-deep: #421c11;
  --gold: #efbd87;
  --gold-light: #f7d5ad;
  --ink: #1b1411;
  --soft: #65574e;
  --line: #dfcbb8;

  --light-x: 78%;
  --light-y: 22%;
  --light-strength: .78;
  --light-shift: 0px;
  --light-shift-y: 0px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.7;

  background:

    ),

      #faf3e9,
      #f1e4d6
    );
}

a {
  color: inherit;
}


/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: rgba(249,240,227,.92);
  backdrop-filter: blur(15px);

  border-bottom: 1px solid rgba(125,75,52,.16);
}

.header-inner {
  min-height: 82px;
  width: min(1120px, 90%);
  margin: 0 auto;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.identity {
  text-decoration: none;
}

.name {
  font-size: 1.5rem;
  letter-spacing: -.02em;
}

.topic {
  margin-top: 2px;
  color: var(--fox);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .12em;
  line-height: 1.5;
}

nav {
  display: flex;
  gap: 20px;
  align-items: center;
}

nav a {
  position: relative;

  text-decoration: none;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .67rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;

  color: #493a33;
}

nav a:hover {
  color: var(--fox);
}

nav a::after {
  content: "";

  position: absolute;
  left: 0;
  bottom: -7px;

  width: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    var(--fox-dark),
    var(--gold)
  );

  transition: width .25s ease;
}


/* =========================
   SPRACHEN
========================= */

.language-switcher {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: 8px;
}

.lang-button {
  width: 32px;
  height: 32px;

  padding: 0;

  border: 1px solid rgba(116,51,31,.18);
  border-radius: 50%;

  background: rgba(255,250,243,.72);

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 16px;

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

.lang-button:hover {
  transform: translateY(-2px);
  background: #fffaf3;

  box-shadow:
    0 5px 14px rgba(66,30,17,.12);
}

.lang-button.active {
  box-shadow:
    0 0 0 2px rgba(169,84,53,.18);
}


/* geschwungene schwarze Zorro-Maske */

.zorro-icon {
  width: 20px;
  height: 16px;
  position: relative;
}

.zorro-icon::before,
.zorro-icon::after {
  content: "";
  position: absolute;

  top: 4px;

  width: 9px;
  height: 6px;

  background: #111;

  border-radius: 55% 45% 55% 45%;
}

.zorro-icon::before {
  left: 0;

  transform:
    rotate(-12deg)
    skewX(-12deg);
}

.zorro-icon::after {
  right: 0;

  transform:
    rotate(12deg)
    skewX(12deg);
}

.zorro-icon span {
  position: absolute;

  left: 5px;
  top: 5px;

  width: 10px;
  height: 3px;

  background: #111;

  border-radius: 50%;

  transform: rotate(-2deg);
}


/* =========================
   MOBILE MENU
========================= */

.menu-button {
  display: none;

  border: 0;
  background: none;

  padding: 8px;
  cursor: pointer;
}

.menu-button span {
  display: block;

  width: 26px;
  height: 2px;

  margin: 5px 0;

  background: var(--fox-dark);
}

.mobile-menu {
  display: none;

  background: rgba(255,250,243,.98);
  border-top: 1px solid var(--line);
}

.mobile-menu.open {
  display: block;
}

.mobile-menu a {
  display: block;

  padding: 16px 5%;

  border-bottom: 1px solid var(--line);

  text-decoration: none;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;

  color: var(--fox-dark);
}


/* =========================
   HERO
========================= */

.hero {
  min-height: 86vh;

  display: flex;
  align-items: center;

  position: relative;
  overflow: hidden;

  background:
    radial-gradient(
      ellipse at var(--light-x) var(--light-y),
      rgba(246,189,126,var(--light-strength)),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 62% 76%,
      rgba(170,76,43,.22),
      transparent 43%
    ),
    linear-gradient(
      125deg,
      #fbf3e7 0%,
      #f7dfc8 38%,
      #d58b61 70%,
      #9f492f 112%
    );
}

.hero::before {
  content: "";

  position: absolute;

  width: 900px;
  height: 900px;

  right: calc(-380px + var(--light-shift));
  top: calc(-390px + var(--light-shift-y));

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,231,193,.88) 0%,
      rgba(239,177,116,.55) 25%,
      rgba(201,116,72,.20) 52%,
      transparent 72%
    );

  filter: blur(10px);
  pointer-events: none;
}

.hero::after {
  content: "";

  position: absolute;

  width: 1100px;
  height: 360px;

  left: calc(-300px + var(--light-shift));
  bottom: -170px;

  background:
    radial-gradient(
      ellipse,
      rgba(255,208,158,.25),
      transparent 70%
    );

  filter: blur(30px);

  transform: rotate(-8deg);

  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;

  width: min(1120px, 90%);
  margin: 0 auto;
}

.eyebrow {
  color: var(--fox-dark);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .73rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;

  margin-bottom: 25px;
}

h1 {
  margin: 0 0 35px;

  font-size: clamp(3.5rem, 9vw, 7.8rem);
  line-height: .88;
  font-weight: 400;
  letter-spacing: -.065em;
}

.hero-text {
  max-width: 800px;

  font-size: clamp(1.2rem, 2.3vw, 1.55rem);

  color: #49352d;
}

.hero-services {
  margin-top: 18px;

  color: var(--fox-dark);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
}

.fox-line {
  width: 170px;
  height: 5px;

  margin-top: 45px;

  background:
    linear-gradient(
      90deg,
      var(--fox-deep),
      var(--fox),
      var(--gold)
    );

  box-shadow:
    0 5px 20px rgba(105,43,26,.25);
}


/* =========================
   SECTIONS
========================= */

section {
  padding: 110px 0;
  border-top: 1px solid var(--line);
}

.container {
  width: min(1120px, 90%);
  margin: 0 auto;
}

.label {
  color: var(--fox);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .71rem;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;

  margin-bottom: 18px;
}

h2 {
  margin: 0 0 30px;

  font-size: clamp(2.6rem, 5vw, 4.8rem);
  line-height: 1;
  font-weight: 400;
  letter-spacing: -.045em;
}

.intro {
  max-width: 800px;

  font-size: 1.2rem;

  color: #4d423b;
}


/* =========================
   BÜCHER
========================= */

.books {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 55px;

  margin-top: 65px;
}

.book {
  position: relative;

  background: rgba(255,250,243,.55);

  padding: 8px;

  box-shadow:
    0 28px 70px rgba(67,31,18,.09);

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}

.book:hover {
  transform: translateY(-6px);

  box-shadow:
    0 35px 85px rgba(67,31,18,.15);
}

.cover-wrap {
  position: relative;

  min-height: 480px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 75% 20%,
      rgba(255,220,177,.72),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #f4e0cb,
      #dfaa83 58%,
      #bd6848
    );
}

.cover-wrap::before {
  content: "";

  position: absolute;

  width: 430px;
  height: 430px;

  top: -180px;
  right: -130px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,227,190,.7),
      transparent 68%
    );

  filter: blur(12px);
}

.cover {
  position: relative;
  z-index: 2;

  width: auto;
  max-width: 72%;
  max-height: 455px;

  object-fit: contain;
  display: block;

  filter:
    drop-shadow(
      18px 24px 18px rgba(55,24,14,.30)
    );

  transition:
    transform .35s ease,
    filter .35s ease;
}

.book:hover .cover {
  transform:
    translateY(-8px)
    rotate(-.35deg);

  filter:
    drop-shadow(
      22px 31px 22px rgba(55,24,14,.34)
    );
}

.book-number {
  margin-top: 32px;

  color: var(--fox);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .16em;
}

.book h3 {
  margin: 17px 0 7px;

  font-size: clamp(1.8rem, 3vw, 2.7rem);
  line-height: 1.05;
  font-weight: 400;
}

.subtitle {
  color: var(--soft);
  font-style: italic;
  margin-bottom: 25px;
}

.book p {
  color: #4b4039;
}

.meta {
  margin-top: 28px;
  padding-top: 20px;

  border-top: 1px solid var(--line);

  color: var(--soft);

  font-family: Arial, Helvetica, sans-serif;
  font-size: .76rem;
}

.book-link {
  display: inline-block;

  margin-top: 25px;

  padding: 12px 19px;

  border: 1px solid var(--fox);

  color: var(--fox-dark);

  text-decoration: none;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;

  transition: .2s ease;
}

.book-link:hover {
  background: var(--fox);
  color: #fffaf3;
}


/* =========================
   AUFKLAPPBARE TEXTE
========================= */

.book-extra {
  max-height: 0;
  overflow: hidden;

  opacity: 0;

  transition:
    max-height .5s ease,
    opacity .35s ease;
}

.book.open .book-extra {
  max-height: 800px;
  opacity: 1;
}

.more-button {
  margin-top: 24px;

  padding: 0;

  border: none;
  background: none;

  color: var(--fox);

  cursor: pointer;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}


/* =========================
   FUCHS-SILHOUETTE
========================= */

.fox-sign {
  position: relative;

  width: 100%;
  height: 180px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #fffaf3,
      #f4e6d7
    );
}

.fox-shadow {
  width: 210px;
  height: 125px;

  opacity: .78;

  filter:
    drop-shadow(
      0 18px 20px rgba(66,30,17,.20)
    );
}


/* =========================
   FRAGE
========================= */

.question {
  text-align: center;

  background:
    radial-gradient(
      ellipse at 70% 0%,
      rgba(220,148,96,.32),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #f8eee2,
      #efd5bd
    );
}

.question-inner {
  max-width: 850px;
  margin: 0 auto;
}

.question-mark {
  color: var(--fox);

  font-size: 4rem;
  line-height: 1;

  margin-bottom: 20px;
}

.question-text {
  font-size: clamp(1.45rem, 3vw, 2.25rem);
  line-height: 1.4;

  color: #4a352c;
}

.question-small {
  margin-top: 30px;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;

  color: var(--fox);
}


/* =========================
   GEDANKEN
========================= */

.thoughts {
  background:
    radial-gradient(
      ellipse at 18% 15%,
      rgba(218,140,91,.20),
      transparent 38%
    ),
    radial-gradient(
      ellipse at 82% 75%,
      rgba(185,107,68,.12),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      #fffaf3 0%,
      #f8eee3 48%,
      #f1dfce 100%
    );

  box-shadow:
    inset 0 25px 70px rgba(103,55,31,.05),
    inset 0 -25px 70px rgba(103,55,31,.04);
}

.thoughts-intro {
  max-width: 760px;

  font-size: 1.2rem;

  color: #4d423b;
}

.thought {
  max-width: 850px;

  margin-top: 55px;
  padding-top: 35px;

  border-top: 1px solid var(--line);
}

.thought-title {
  font-size: clamp(1.9rem, 4vw, 3rem);

  line-height: 1.1;

  margin-bottom: 18px;
}

.thought-text {
  font-size: 1.12rem;
  color: #51453d;
}

.thought-date {
  margin-top: 18px;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;

  color: var(--fox);
}


/* =========================
   VERBINDUNG
========================= */

.connection {
  color: var(--ink);

  background:
    radial-gradient(
      ellipse at var(--light-x) var(--light-y),
      rgba(246,189,126,var(--light-strength)),
      transparent 34%
    ),
    radial-gradient(
      ellipse at 62% 76%,
      rgba(170,76,43,.22),
      transparent 43%
    ),
    linear-gradient(
      125deg,
      #fbf3e7 0%,
      #f7dfc8 38%,
      #d58b61 70%,
      #9f492f 112%
    );
}

.connection .label {
  color: var(--fox-dark);
}

.connection h2 {
  color: var(--ink);
}

.connection-text {
  max-width: 850px;

  font-size: clamp(1.35rem, 2.8vw, 2rem);
  line-height: 1.5;
}

.connection-text em {
  color: var(--fox-dark);
}


/* =========================
   AUTOR
========================= */

.about {
  display: grid;

  grid-template-columns: .8fr 1.2fr;

  gap: 80px;
}

.about-name {
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  line-height: .95;
}

.about p {
  font-size: 1.12rem;
  color: #4b4039;
}


/* =========================
   KONTAKT
========================= */

.contact {
  background:
    radial-gradient(
      ellipse at 80% 10%,
      rgba(218,140,91,.30),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      #f5e5d5,
      #edd0b9
    );
}

.contact-box {
  max-width: 760px;
}

.contact-box p {
  font-size: 1.18rem;
  color: #4c3d34;
}

.contact-button {
  display: inline-block;

  margin-top: 20px;
  padding: 13px 22px;

  background: var(--fox);
  color: #fffaf3;

  text-decoration: none;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.contact-button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(116,51,31,.18);

  background: var(--fox-dark);
}


/* =========================
   IMPRESSUM
========================= */

.impressum {
  background: #eee3d5;
}

.impressum-box {
  max-width: 760px;
}

.impressum p {
  color: #51463e;
}


/* =========================
   FOOTER
========================= */

footer {
  border-top: 1px solid var(--line);

  padding: 35px 0;

  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;

  color: var(--soft);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 950px) {

  nav {
    gap: 13px;
  }

  .language-switcher {
    gap: 4px;
    margin-left: 2px;
  }

}

@media (max-width: 760px) {

  .header-inner {
    min-height: 72px;
  }

  nav,
  .header-inner > .language-switcher {
    display: none;
  }

  .menu-button {
    display: block;
  }

  .mobile-menu .language-mobile {
    display: flex;
    gap: 8px;
    padding: 14px 5%;
  }

  .mobile-menu .language-mobile button {
    border: 1px solid var(--line);
    background: #fffaf3;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    cursor: pointer;
  }

  .hero {
    min-height: 78vh;
  }

  section {
    padding: 75px 0;
  }

  .books,
  .about {
    grid-template-columns: 1fr;
  }

  .book {
    padding: 7px;
  }

  .cover-wrap {
    min-height: 410px;
  }

  .cover {
    max-width: 78%;
  }

  h1 {
    font-size: 4.2rem;
  }

  .hero-services {
    max-width: 330px;
    line-height: 1.8;
  }

}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {
